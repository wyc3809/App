  <!-- wine banner -->
  <path stroke="#1a1a1a" stroke-width="4" d="M500 70v120"/>
  <path fill="#1a1a1a" fill-opacity=".75" d="M504 78h48l-8 28 8 28h-48z"/>
  <path fill="#f3ebdc" d="M520 96h14v6h-5v18h-4v-18h-5z"/>
