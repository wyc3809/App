      <stop stop-color="#f7efd9"/>
      <stop offset="1" stop-color="#e0d0a8"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="1.2"/></filter>
  </defs>
  <rect width="900" height="260" fill="url(#paper)"/>
  <path d="M0 170 C140 110 240 140 360 90 C480 40 580 130 700 80 C800 40 850 70 900 50 L900 260 L0 260Z" fill="#1a1a1a" opacity=".12" filter="url(#soft)"/>
  <path d="M0 210 C160 170 280 200 420 150 C560 100 700 170 900 120 L900 260 L0 260Z" fill="#1a1a1a" opacity=".16"/>
  <!-- rain -->
  <path stroke="#1a1a1a" stroke-opacity=".2" stroke-width="2" stroke-linecap="round" d="M80 20l8 36M120 10l6 40M160 28l7 30M640 16l8 38M700 8l5 36M760 24l7 32"/>
  <!-- inn roof -->
  <path fill="#1a1a1a" fill-opacity=".7" d="M520 120l120-40 120 40v16H520z"/>
