<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none" role="img" aria-label="WorthBook">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1A3A2C"/>
      <stop offset="100%" stop-color="#0A0E0C"/>
    </radialGradient>
    <linearGradient id="pageL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFCF7"/>
      <stop offset="100%" stop-color="#E8E4DB"/>
    </linearGradient>
    <filter id="sh" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <g filter="url(#sh)">
    <!-- Open ledger wings -->
    <path d="M96 196c24-28 68-44 116-44 28 0 52 8 72 22V360c-22 14-48 22-78 22-52 0-96-22-110-54V196z" fill="url(#pageL)"/>
    <path d="M416 196c-24-28-68-44-116-44-28 0-52 8-72 22V360c22 14 48 22 78 22 52 0 96-22 110-54V196z" fill="#F3F1EC"/>
    <path d="M256 174v210" stroke="#D8D2C6" stroke-width="5"/>

    <!-- Grid + chart on pages -->
    <g opacity="0.18" stroke="#16a34a" stroke-width="2">
      <path d="M128 240h72M128 268h72M128 296h72M140 228v84M164 228v84M188 228v84"/>
    </g>
    <path d="M300 300l28-36 24 14 40-52 36 18" stroke="#16a34a" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M428 244l14-16 10 8" stroke="#16a34a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Cat torso / book spine -->
    <ellipse cx="256" cy="330" rx="92" ry="74" fill="#F7F7F5"/>
    <path d="M176 286c10-54 48-88 80-88s70 34 80 88" fill="#F7F7F5"/>

    <!-- W scarf -->
    <path d="M188 312c20-8 40-12 68-12s48 4 68 12l-8 28c-18 10-40 16-60 16s-42-6-60-16l-8-28z" fill="#15803d"/>
    <path d="M214 300l42 18 42-18" stroke="#22c55e" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Ears -->
    <path d="M208 226l-22-40 40 22z" fill="#F7F7F5" stroke="#E7C4C4" stroke-width="4" stroke-linejoin="round"/>
    <path d="M304 226l22-40-40 22z" fill="#F7F7F5" stroke="#E7C4C4" stroke-width="4" stroke-linejoin="round"/>
    <path d="M214 210l-8-12 12 8z" fill="#16a34a"/>
    <path d="M298 210l8-12-12 8z" fill="#16a34a"/>

    <!-- Face -->
    <path d="M228 268c0-8 8-14 16-14" stroke="#333" stroke-width="5" stroke-linecap="round"/>
    <path d="M284 268c0-8-8-14-16-14" stroke="#333" stroke-width="5" stroke-linecap="round"/>
    <ellipse cx="244" cy="282" rx="5" ry="7" fill="#333"/>
    <ellipse cx="268" cy="282" rx="5" ry="7" fill="#333"/>
    <path d="M248 296c6 8 20 8 26 0" stroke="#333" stroke-width="4" stroke-linecap="round" fill="none"/>
    <circle cx="236" cy="294" r="9" fill="#FFB4B4" opacity="0.55"/>
    <circle cx="276" cy="294" r="9" fill="#FFB4B4" opacity="0.55"/>

    <!-- Bell -->
    <circle cx="256" cy="328" r="11" fill="#F0C832" stroke="#C8941A" stroke-width="2"/>
    <path d="M256 322v12" stroke="#C8941A" stroke-width="2" stroke-linecap="round"/>

    <!-- Raised paw -->
    <ellipse cx="348" cy="248" rx="30" ry="26" fill="#F7F7F5" transform="rotate(-16 348 248)"/>
    <path d="M334 228c6-16 18-26 30-22 8 4 12 14 8 24" fill="#F7F7F5"/>
    <path d="M340 218c0-5 3-8 6-6s3 7 0 10" stroke="#333" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M354 210c0-5 3-8 6-6s3 7 0 10" stroke="#333" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M368 218c0-5 3-8 6-6s3 7 0 10" stroke="#333" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Pen paw drawing chart -->
    <ellipse cx="178" cy="300" rx="20" ry="16" fill="#F7F7F5"/>
    <path d="M188 292l18-48" stroke="#15803d" stroke-width="8" stroke-linecap="round"/>
    <path d="M202 246l8-6 6 8-8 6z" fill="#333"/>
  </g>
</svg>
