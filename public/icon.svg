<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none" role="img" aria-label="WorthBook">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="58%">
      <stop offset="0%" stop-color="#1A3A2C"/>
      <stop offset="55%" stop-color="#101814"/>
      <stop offset="100%" stop-color="#0A0E0C"/>
    </radialGradient>
    <linearGradient id="book" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <ellipse cx="256" cy="280" rx="150" ry="110" fill="#16a34a" opacity="0.12"/>

  <g filter="url(#shadow)">
    <!-- Coins -->
    <ellipse cx="148" cy="332" rx="36" ry="10" fill="#000" opacity="0.2"/>
    <circle cx="148" cy="318" r="28" fill="#E8B923" stroke="#C8941A" stroke-width="3"/>
    <circle cx="148" cy="318" r="10" fill="#C8941A" opacity="0.55"/>
    <circle cx="188" cy="328" r="22" fill="#F0C832" stroke="#C8941A" stroke-width="2.5"/>
    <circle cx="188" cy="328" r="8" fill="#C8941A" opacity="0.5"/>

    <!-- Open ledger -->
    <path d="M196 300c0-10 8-18 18-18h84c10 0 18 8 18 18v72c0 8-6 14-14 14H210c-8 0-14-6-14-14V300z" fill="url(#book)"/>
    <path d="M256 282v114" stroke="#0d1110" stroke-width="4" opacity="0.15"/>
    <path d="M214 334h76" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity="0.35"/>
    <path d="M220 312l18-14 16 10 26-28 18 8" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M296 288l10-12 8 6" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Cat body -->
    <ellipse cx="292" cy="356" rx="88" ry="72" fill="#F7F7F5"/>
    <path d="M236 300c8-36 36-58 72-58 42 0 72 30 72 72 0 28-14 52-36 66" fill="#F7F7F5"/>
    <!-- Ears -->
    <path d="M248 248l-18-34 34 18z" fill="#F7F7F5" stroke="#E7C4C4" stroke-width="4" stroke-linejoin="round"/>
    <path d="M364 248l18-34-34 18z" fill="#F7F7F5" stroke="#E7C4C4" stroke-width="4" stroke-linejoin="round"/>
    <path d="M252 232l-8-14 14 8z" fill="#FFB4B4"/>
    <path d="M360 232l8-14-14 8z" fill="#FFB4B4"/>
    <!-- Face -->
    <path d="M268 292c0-10 8-16 18-16" stroke="#333" stroke-width="5" stroke-linecap="round"/>
    <path d="M344 292c0-10-8-16-18-16" stroke="#333" stroke-width="5" stroke-linecap="round"/>
    <ellipse cx="286" cy="304" rx="5" ry="7" fill="#333"/>
    <ellipse cx="326" cy="304" rx="5" ry="7" fill="#333"/>
    <path d="M296 318c8 10 24 10 32 0" stroke="#333" stroke-width="4" stroke-linecap="round" fill="none"/>
    <!-- Cheeks -->
    <circle cx="274" cy="316" r="10" fill="#FFB4B4" opacity="0.55"/>
    <circle cx="338" cy="316" r="10" fill="#FFB4B4" opacity="0.55"/>
    <!-- Collar + bell -->
    <path d="M252 334h104c0 0 8 10 0 18H252c-8-8 0-18 0-18z" fill="#DC2626"/>
    <circle cx="304" cy="352" r="12" fill="#F0C832" stroke="#C8941A" stroke-width="2"/>
    <path d="M304 346v12" stroke="#C8941A" stroke-width="2" stroke-linecap="round"/>
    <!-- Raised paw -->
    <ellipse cx="372" cy="268" rx="34" ry="28" fill="#F7F7F5" transform="rotate(-18 372 268)"/>
    <path d="M356 248c6-18 18-28 32-24 10 4 14 16 8 28-8 16-24 22-38 14" fill="#F7F7F5"/>
    <path d="M362 236c0-6 4-10 8-8s4 8 0 12" stroke="#333" stroke-width="3" stroke-linecap="round"/>
    <path d="M378 228c0-6 4-10 8-8s4 8 0 12" stroke="#333" stroke-width="3" stroke-linecap="round"/>
    <path d="M394 236c0-6 4-10 8-8s4 8 0 12" stroke="#333" stroke-width="3" stroke-linecap="round"/>
    <!-- Holding paw on book -->
    <ellipse cx="228" cy="322" rx="22" ry="18" fill="#F7F7F5"/>
  </g>
</svg>
