<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none" role="img" aria-label="WorthBook">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="58%">
      <stop offset="0%" stop-color="#1A3A2C"/>
      <stop offset="55%" stop-color="#101814"/>
      <stop offset="100%" stop-color="#0A0E0C"/>
    </radialGradient>
    <linearGradient id="cover" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1A2420"/>
      <stop offset="100%" stop-color="#0D1411"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <ellipse cx="256" cy="300" rx="168" ry="128" fill="#0F7A4C" opacity="0.18"/>

  <g filter="url(#shadow)">
    <!-- Open book -->
    <path d="M118 220 C118 208 128 200 140 200 H236 C246 200 252 206 256 214 C260 206 266 200 276 200 H372 C384 200 394 208 394 220 V372 C394 386 382 396 368 396 H276 C266 396 260 390 256 382 C252 390 246 396 236 396 H144 C130 396 118 386 118 372 Z" fill="url(#cover)"/>
    <path d="M132 216 H244 C250 216 254 220 256 226 V364 C252 372 246 376 236 376 H144 C136 376 132 370 132 362 Z" fill="#FFFCF7"/>
    <path d="M380 216 H268 C262 216 258 220 256 226 V364 C260 372 266 376 276 376 H368 C376 376 380 370 380 362 Z" fill="#F3F1EC"/>
    <path d="M256 226 C252 238 252 340 256 364 C260 340 260 238 256 226 Z" fill="#D8D2C6" opacity="0.9"/>

    <!-- Grid on pages -->
    <g opacity="0.12" stroke="#16a34a" stroke-width="1.5">
      <path d="M148 280h88M148 304h88M148 328h88M160 268v72M184 268v72M208 268v72"/>
      <path d="M268 280h88M268 304h88M268 328h88M280 268v72M304 268v72M328 268v72"/>
    </g>

    <!-- Rising chart on book -->
    <path d="M168 340 L208 314 L236 326 L268 276 L300 290 L344 226" stroke="#3DCF8E" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="344" cy="226" r="12" fill="#3DCF8E"/>
    <circle cx="344" cy="226" r="5" fill="#0D1110" opacity="0.35"/>

    <!-- Cat head (#3 style) -->
    <ellipse cx="256" cy="168" rx="78" ry="72" fill="#F7F7F5"/>
    <path d="M196 148 L178 108 L212 126 Z" fill="#F7F7F5" stroke="#E7C4C4" stroke-width="3" stroke-linejoin="round"/>
    <path d="M316 148 L334 108 L300 126 Z" fill="#F7F7F5" stroke="#E7C4C4" stroke-width="3" stroke-linejoin="round"/>
    <path d="M202 118 L194 102 L208 110 Z" fill="#DC2626"/>
    <path d="M310 118 L318 102 L304 110 Z" fill="#DC2626"/>

    <!-- Closed happy eyes -->
    <path d="M224 158c0-10 8-16 18-16" stroke="#333" stroke-width="6" stroke-linecap="round"/>
    <path d="M288 158c0-10-8-16-18-16" stroke="#333" stroke-width="6" stroke-linecap="round"/>
    <ellipse cx="256" cy="178" rx="8" ry="10" fill="#DC2626"/>
    <path d="M244 188c8 10 24 10 32 0" stroke="#333" stroke-width="4" stroke-linecap="round" fill="none"/>

    <!-- Chart whiskers (signature) -->
    <path d="M196 172l-28-8 8 12M196 186l-32 4 10 10M196 200l-28 12 6 14" stroke="#16a34a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="176" cy="164" r="4" fill="#16a34a"/><circle cx="174" cy="190" r="4" fill="#16a34a"/><circle cx="174" cy="212" r="4" fill="#16a34a"/>
    <path d="M316 172l28-8-8 12M316 186l32 4-10 10M316 200l28 12-6 14" stroke="#16a34a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="336" cy="164" r="4" fill="#16a34a"/><circle cx="338" cy="190" r="4" fill="#16a34a"/><circle cx="338" cy="212" r="4" fill="#16a34a"/>

    <!-- Red collar + bell -->
    <path d="M204 228h104c0 0 6 10-2 16H206c-8-6-2-16-2-16z" fill="#DC2626"/>
    <circle cx="256" cy="244" r="13" fill="#F0C832" stroke="#C8941A" stroke-width="2"/>
    <path d="M256 236v16" stroke="#C8941A" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
