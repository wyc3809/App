name: Deploy WorthBook to GitHub Pages

# Publishes WorthBook under /worthtracker/ while keeping other gh-pages files (e.g. game).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: worthtracker-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build:pages

      # Overlay new WorthBook build onto existing gh-pages (preserve game at repo Pages root)
      - name: Assemble site (gh-pages + worthtracker)
        run: |
          set -euo pipefail
          rm -rf _site
          git clone --depth 1 --branch gh-pages "https://github.com/${{ github.repository }}.git" _site
          rm -rf _site/.git _site/worthtracker
          mkdir -p _site/worthtracker
          cp -a out/. _site/worthtracker/
          touch _site/worthtracker/.nojekyll
          touch _site/.nojekyll

      - name: Deploy with peaceiris (branch publish)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          force_orphan: false
          keep_files: false
          commit_message: "deploy: worthtracker from ${{ github.sha }}"
